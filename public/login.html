<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | Staff Tracker</title>
<style>
:root{box-sizing:border-box;
--bg:#f6f5fb;--surface:#fff;--text:#1a1a2e;--muted:#6b6b80;--line:#e8e6f2;--p:#7c3aed;--p2:#ede9fe;--bad:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111c;--surface:#1c1929;--text:#f1eefc;--muted:#a09bb8;--line:#2e2a44;--p:#8b5cf6;--p2:#2a2150;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111c;--surface:#1c1929;--text:#f1eefc;--muted:#a09bb8;--line:#2e2a44;--p:#8b5cf6;--p2:#2a2150;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.logo{font-size:26px;font-weight:800;color:var(--p);margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
form{display:grid;gap:12px}
label{font-size:13px;color:var(--muted);display:grid;gap:6px}
input,button{font:inherit;font-size:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
button{background:var(--p);color:#fff;border-color:var(--p);cursor:pointer;font-weight:600;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
</style>
</head>
<body>
<div class="box">
  <h1 class="logo">Staff Tracker</h1>
  <p class="sub">Sign in to continue</p>
  <form id="f">
    <label>Username<input id="u" autocomplete="username" required autofocus></label>
    <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err"></p>
    <button id="b">Log in</button>
  </form>
</div>
<script>
// ផ្ញើ Username/Password ទៅ /api/login បើត្រូវ Server ដាក់ Cookie ហើយយើងទៅទំព័រដើម
document.getElementById("f").onsubmit=async e=>{
 e.preventDefault();
 const err=document.getElementById("err"),b=document.getElementById("b");
 err.textContent="";b.disabled=true;
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})});
  const d=await r.json();
  if(r.ok){location.href="/";return}
  err.textContent=d.error||"Login failed";
 }catch(x){err.textContent="Cannot reach server"}
 b.disabled=false;
};
</script>
</body>
</html>
